name: Sync Latest Repos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch repositories and update README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // 1. Get public repositories, newest first
            const { data: repos } = await github.rest.repos.listForUser({
              username: context.repo.owner,
              sort: 'created',
              direction: 'desc',
              per_page: 100,
            });

            // 2. Select up to six public, non-fork repositories
            const visible = repos
              .filter(r => !r.fork && !r.private)
              .slice(0, 6);

            // 3. Build the repository table
            let table = '| Repo | Description | Language | Updated |\n';
            table += '| :-- | :-- | :-- | :-- |\n';

            for (const r of visible) {
              const desc = (r.description || '—')
                .replace(/\|/g, '-')
                .replace(/\r?\n/g, ' ');

              const lang = (r.language || '—').replace(/\|/g, '-');
              const updated = new Date(r.pushed_at)
                .toISOString()
                .split('T')[0];

              table += `| [${r.name}](${r.html_url}) | ${desc} | ${lang} | ${updated} |\n`;
            }

            // 4. Read README
            const path = 'README.md';

            if (!fs.existsSync(path)) {
              core.setFailed('README.md was not found.');
              return;
            }

            let content = fs.readFileSync(path, 'utf8');

            const start = '<!-- REPOS:START -->';
            const end = '<!-- REPOS:END -->';

            const startIdx = content.indexOf(start);
            const endIdx = content.indexOf(end);

            if (
              startIdx === -1 ||
              endIdx === -1 ||
              endIdx < startIdx + start.length
            ) {
              core.setFailed(
                'README.md must contain valid <!-- REPOS:START --> and <!-- REPOS:END --> markers.'
              );
              return;
            }

            // 5. Replace only the content between the markers
            const before = content.slice(0, startIdx + start.length);
            const after = content.slice(endIdx);

            content = `${before}\n${table}\n${after}`;

            fs.writeFileSync(path, content, 'utf8');

      - name: Commit changes if README was updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README has no changes. Nothing to commit."
            exit 0
          fi

          git commit -m "chore: manually sync latest repositories"
          git push
